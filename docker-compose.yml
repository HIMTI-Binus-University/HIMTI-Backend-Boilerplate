services:
   postgres:
      image: postgres:16-alpine
      container_name: root-team-member-list-postgres
      restart: unless-stopped
      environment:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: root_team_member_list
      ports:
         - '5432:5432'
      volumes:
         - postgres-data:/var/lib/postgresql/data

volumes:
   postgres-data:
